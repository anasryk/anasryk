<circle cx="980" cy="300" r="170" fill="#22d3ee" opacity="0.16" filter="url(#blur)"><animate attributeName="cx" values="980;800;980" dur="16s" repeatCount="indefinite"/></circle>
<rect x="-300" y="0" width="300" height="400" fill="url(#sweep)"><animate attributeName="x" from="-300" to="1200" dur="7s" repeatCount="indefinite"/></rect>
