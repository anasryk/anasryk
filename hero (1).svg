<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3B82F6" stroke-opacity="0.09"/></pattern>
<linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="700" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#60a5fa"/><stop offset="0.35" stop-color="#22d3ee"/><stop offset="0.7" stop-color="#3B82F6"/><stop offset="1" stop-color="#60a5fa"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="700 0" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#3B82F6" stop-opacity="0"/><stop offset="0.5" stop-color="#60a5fa" stop-opacity="0.16"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<clipPath id="clip"><rect width="1200" height="400" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
